<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Luồng request và các object cấu hình ứng dụng</text>

  <rect x="24" y="70" width="110" height="56" rx="9" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="79" y="95" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Client</text>
  <text x="79" y="112" font-size="11" fill="#6B7280" text-anchor="middle">trình duyệt / API</text>

  <rect x="178" y="56" width="190" height="84" rx="9" fill="#E7F0FF" stroke="#326CE5" stroke-width="1.5"/>
  <text x="273" y="82" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Ingress Controller</text>
  <text x="273" y="103" font-size="11" fill="#374151" text-anchor="middle">ingress-nginx · định tuyến host/path</text>
  <text x="273" y="122" font-size="11" fill="#374151" text-anchor="middle">TLS bởi cert-manager</text>

  <rect x="418" y="70" width="130" height="56" rx="9" fill="#E7F0FF" stroke="#326CE5" stroke-width="1.5"/>
  <text x="483" y="95" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Service</text>
  <text x="483" y="112" font-size="11" fill="#374151" text-anchor="middle">ClusterIP ổn định</text>

  <rect x="598" y="52" width="278" height="100" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="737" y="76" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Deployment: 3 replicas</text>
  <rect x="614" y="86" width="78" height="50" rx="6" fill="#ffffff" stroke="#16A34A"/><text x="653" y="116" font-size="12" fill="#166534" text-anchor="middle">Pod A</text>
  <rect x="698" y="86" width="78" height="50" rx="6" fill="#ffffff" stroke="#16A34A"/><text x="737" y="116" font-size="12" fill="#166534" text-anchor="middle">Pod B</text>
  <rect x="782" y="86" width="78" height="50" rx="6" fill="#ffffff" stroke="#16A34A"/><text x="821" y="116" font-size="12" fill="#166534" text-anchor="middle">Pod C</text>

  <g stroke="#326CE5" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M134,98 L178,98"/>
    <path d="M368,98 L418,98"/>
    <path d="M548,98 L598,98"/>
  </g>

  <rect x="178" y="210" width="190" height="56" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="1.4"/>
  <text x="273" y="235" font-size="13" font-weight="700" fill="#9A3412" text-anchor="middle">ConfigMap</text>
  <text x="273" y="252" font-size="11" fill="#7C2D12" text-anchor="middle">cấu hình không nhạy cảm</text>

  <rect x="418" y="210" width="130" height="56" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="483" y="235" font-size="13" font-weight="700" fill="#991B1B" text-anchor="middle">Secret</text>
  <text x="483" y="252" font-size="11" fill="#7F1D1D" text-anchor="middle">password, token</text>

  <rect x="598" y="210" width="278" height="56" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="737" y="235" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">HPA</text>
  <text x="737" y="252" font-size="11" fill="#4C1D95" text-anchor="middle">scale replicas theo CPU/RAM (cần metrics-server)</text>

  <g stroke="#9CA3AF" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#a)">
    <path d="M273,210 L653,152"/>
    <path d="M483,210 L821,152"/>
  </g>
  <g stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M737,210 L737,152"/>
  </g>
  <text x="555" y="192" font-size="11" fill="#6B7280">inject env / mount file vào Pod</text>
  <text x="755" y="192" font-size="11" fill="#6B7280">thay đổi số replica</text>

  <rect x="24" y="316" width="852" height="70" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="40" y="340" font-size="12" font-weight="700" fill="#1B4F9C">Nguyên tắc chung:</text>
  <text x="40" y="360" font-size="12" fill="#1F2937">Mọi object đều khai báo bằng YAML. Controller liên tục so sánh actual state với desired state và tự sửa lệch (tạo lại Pod, scale, rollback).</text>
  <text x="40" y="377" font-size="11" fill="#4B5563">Pod chết hoặc IP thay đổi không sao — Service luôn trỏ tới đúng nhóm Pod hiện tại.</text>
</svg>
