<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Stack giám sát: metrics, logs, alert</text>

  <g fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2">
    <rect x="16" y="52" width="200" height="38" rx="7"/>
    <rect x="16" y="100" width="200" height="38" rx="7"/>
    <rect x="16" y="148" width="200" height="38" rx="7"/>
    <rect x="16" y="196" width="200" height="38" rx="7"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="116" y="76" text-anchor="middle">node-exporter</text>
    <text x="116" y="124" text-anchor="middle">kube-state-metrics</text>
    <text x="116" y="172" text-anchor="middle">kubelet / cAdvisor</text>
    <text x="116" y="220" text-anchor="middle">app /metrics</text>
  </g>
  <text x="116" y="252" font-size="11" fill="#6B7280" text-anchor="middle">Prometheus scrape định kỳ</text>

  <path d="M216,71 L244,71 L244,215 L216,215" stroke="#9CA3AF" stroke-width="1.3" fill="none"/>
  <g stroke="#9CA3AF" stroke-width="1.3" fill="none" marker-end="url(#a)"><path d="M216,119 L244,119"/><path d="M216,167 L244,167"/></g>
  <path d="M244,130 L272,130" stroke="#326CE5" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <rect x="272" y="92" width="150" height="76" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="347" y="121" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Prometheus</text>
  <text x="347" y="141" font-size="11" fill="#78350F" text-anchor="middle">time-series + alert rules</text>
  <text x="347" y="157" font-size="11" fill="#78350F" text-anchor="middle">lưu lịch sử dài hạn</text>

  <rect x="500" y="92" width="150" height="76" rx="9" fill="#E7F0FF" stroke="#326CE5" stroke-width="1.6"/>
  <text x="575" y="121" font-size="14" font-weight="700" fill="#1B4F9C" text-anchor="middle">Grafana</text>
  <text x="575" y="141" font-size="11" fill="#374151" text-anchor="middle">dashboard + LogQL</text>
  <text x="575" y="157" font-size="11" fill="#374151" text-anchor="middle">một cửa nhìn mọi thứ</text>

  <rect x="272" y="232" width="150" height="76" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="347" y="261" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">Alertmanager</text>
  <text x="347" y="281" font-size="11" fill="#7F1D1D" text-anchor="middle">route + nhóm + silence</text>
  <text x="347" y="297" font-size="11" fill="#7F1D1D" text-anchor="middle">theo alert rules</text>

  <rect x="500" y="232" width="170" height="76" rx="9" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="585" y="261" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Slack / Telegram</text>
  <text x="585" y="281" font-size="11" fill="#4B5563" text-anchor="middle">email / webhook</text>
  <text x="585" y="297" font-size="11" fill="#4B5563" text-anchor="middle">on-call nhận cảnh báo</text>

  <g stroke="#326CE5" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M422,130 L500,130"/>
    <path d="M347,168 L347,232"/>
    <path d="M422,270 L500,270"/>
  </g>

  <rect x="16" y="350" width="200" height="60" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="116" y="375" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">Promtail / Alloy</text>
  <text x="116" y="393" font-size="11" fill="#4C1D95" text-anchor="middle">DaemonSet mọi node</text>

  <rect x="272" y="350" width="150" height="60" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="347" y="375" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Loki</text>
  <text x="347" y="393" font-size="11" fill="#4C1D95" text-anchor="middle">gom log container</text>

  <g stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#a)"><path d="M216,380 L272,380"/></g>
  <path d="M422,380 C470,380 470,160 575,160" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#a)"/>
  <text x="450" y="352" font-size="11" fill="#6B7280">truy vấn log trong Grafana</text>

  <rect x="660" y="340" width="224" height="80" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="772" y="366" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">metrics-server</text>
  <text x="772" y="385" font-size="11" fill="#4B5563" text-anchor="middle">kubectl top + HPA</text>
  <text x="772" y="403" font-size="11" fill="#B91C1C" text-anchor="middle">luồng riêng, KHÔNG thay Prometheus</text>

  <text x="16" y="446" font-size="11" fill="#6B7280">metrics = số đo theo thời gian · logs = dòng chữ · alerts = quy tắc báo động. Cluster production cần cả ba.</text>
</svg>
