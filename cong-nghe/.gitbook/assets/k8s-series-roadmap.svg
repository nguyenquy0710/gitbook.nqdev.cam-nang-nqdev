<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/></marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="450" y="32" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Lộ trình series Kubernetes — self-host bằng kubeadm trên Ubuntu</text>

  <g>
    <rect x="24" y="76" width="156" height="100" rx="11" fill="#EAF2FF" stroke="#326CE5" stroke-width="1.5"/>
    <circle cx="102" cy="104" r="15" fill="#326CE5"/><text x="102" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="102" y="138" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Kiến trúc</text>
    <text x="102" y="156" font-size="11" fill="#374151" text-anchor="middle">control plane, object</text>
    <text x="102" y="171" font-size="11" fill="#374151" text-anchor="middle">khi nào không cần</text>

    <rect x="196" y="76" width="156" height="100" rx="11" fill="#EAF2FF" stroke="#326CE5" stroke-width="1.5"/>
    <circle cx="274" cy="104" r="15" fill="#326CE5"/><text x="274" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="274" y="138" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Cài đặt</text>
    <text x="274" y="156" font-size="11" fill="#374151" text-anchor="middle">containerd, kubeadm</text>
    <text x="274" y="171" font-size="11" fill="#374151" text-anchor="middle">CNI Calico</text>

    <rect x="368" y="76" width="156" height="100" rx="11" fill="#EAF2FF" stroke="#326CE5" stroke-width="1.5"/>
    <circle cx="446" cy="104" r="15" fill="#326CE5"/><text x="446" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="446" y="138" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Cấu hình app</text>
    <text x="446" y="156" font-size="11" fill="#374151" text-anchor="middle">Deployment, Service</text>
    <text x="446" y="171" font-size="11" fill="#374151" text-anchor="middle">Ingress, HPA</text>

    <rect x="540" y="76" width="156" height="100" rx="11" fill="#EAF2FF" stroke="#326CE5" stroke-width="1.5"/>
    <circle cx="618" cy="104" r="15" fill="#326CE5"/><text x="618" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="618" y="138" font-size="13" font-weight="700" fill="#1B4F9C" text-anchor="middle">Vận hành</text>
    <text x="618" y="156" font-size="11" fill="#374151" text-anchor="middle">drain, upgrade</text>
    <text x="618" y="171" font-size="11" fill="#374151" text-anchor="middle">backup etcd</text>

    <rect x="712" y="76" width="156" height="100" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <circle cx="790" cy="104" r="15" fill="#16A34A"/><text x="790" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="790" y="138" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Giám sát</text>
    <text x="790" y="156" font-size="11" fill="#166534" text-anchor="middle">Prometheus, Grafana</text>
    <text x="790" y="171" font-size="11" fill="#166534" text-anchor="middle">Loki, alert</text>
  </g>

  <g stroke="#326CE5" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M180,126 L196,126"/>
    <path d="M352,126 L368,126"/>
    <path d="M524,126 L540,126"/>
    <path d="M696,126 L712,126"/>
  </g>

  <text x="450" y="216" font-size="12" fill="#4B5563" text-anchor="middle">Mỗi bài xây trên kết quả của bài trước — đọc lần lượt từ 1 đến 5.</text>
  <text x="450" y="238" font-size="11" fill="#6B7280" text-anchor="middle">Yêu cầu: quen Docker/container cơ bản và dòng lệnh Linux.</text>
</svg>
